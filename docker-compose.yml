# OfferRadar Docker Compose 配置

services:
  offer-radar:
    build: .
    container_name: offer-radar
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "python -c 'print(\"OK\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
