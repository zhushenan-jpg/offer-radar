[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "0.1.0"
description = "Multi-agent job search research assistant (crewAI + GLM-5.3-Flash)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "openai>=1.40",
    "instructor>=1.4",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]
m2 = [
    "crewai==1.15.*",
    "jinja2>=3.1",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "html2text>=2024.2.26",
    "apscheduler>=3.10,<4",
    "apprise>=1.9",
    "ddgs>=9",
]
m3 = ["streamlit>=1.37", "scipy>=1.3", "pdfplumber>=0.11"]

[project.scripts]
jobpilot = "jobpilot.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: real API calls, skipped by default"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# typer 的参数默认值必须调用 Option()/Argument(),B008 属于框架误报
"src/jobpilot/app/cli.py" = ["B008"]
