name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,m2,m3]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (mocked, live tests excluded)
        run: pytest -m "not live"

      - name: Upload eval report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: docs/eval-report.md
          if-no-files-found: ignore
